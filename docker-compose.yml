services:
  swagbot:
    image: public.ecr.aws/v6x4t1k2/dpn-workshops/swagbot:langgraph.vertexai.v0.2
    environment:
      ## FLASK Configs:
      - FLASK_HOST=0.0.0.0
      - FLASK_PORT=3000
      # Platform selector (vertex)
      - LLM_PLATFORM=vertex
      - PLANNING_MODEL=gemini-3.5-flash-lite
      - SPECIALIST_MODEL=gemini-3.5-flash-lite
      - SYNTHESIZER_MODEL=gemini-3.5-flash-lite
      # Datadog Environment Variables
      - DD_API_KEY
      - DD_ENV=dev
      - DD_SERVICE=swagbot
      - DD_VERSION=1.0.0
      - DD_AGENT_HOST=agent
      - DD_LOGS_INJECTION=true
      - DD_RUNTIME_METRICS_ENABLED=true
      # RUM
      - DD_RUM_CLIENT_TOKEN=${DD_RUM_CLIENT_TOKEN}
      - DD_RUM_APPLICATION_ID=${DD_RUM_APPLICATION_ID}
      # LLMObs Configuration
      - DD_LLMOBS_ENABLED=1
      - DD_LLMOBS_ML_APP=swagbot
      - DD_LLMOBS_AGENTLESS_ENABLED=0
    # Datadog Labels
    labels:
      com.datadoghq.ad.logs: '[{"source": "python", "service": "swagbot"}]'
      com.datadoghq.tags.env: "dev"
      com.datadoghq.tags.service: "swagbot"
      com.datadoghq.tags.version: "1.0.0"
    env_file:
      - .env
    volumes:
      - ./app/:/app:ro
      - /root/gcp_json_key.json:/root/gcp_json_key.json:ro
    tmpfs:
      - /tmp:mode=1777,size=100M
    read_only: true
    security_opt:
      - no-new-privileges:true
    ports:
      - 3000:3000
    entrypoint: ["ddtrace-run", "python", "swagbot_app.py"]
  agent:
    image: gcr.io/datadoghq/agent:7.77.1
    environment:
      - DD_API_KEY
      - DD_ENV=dev
      - DD_LOGS_ENABLED=true
      - DD_LOGS_CONFIG_CONTAINER_COLLECT_ALL=true
      - DD_CONTAINER_EXCLUDE_LOGS=image:gcr.io/datadoghq/agent.*
      - DD_PROCESS_AGENT_ENABLED=true
      - DD_APM_ENABLED=true
      - DD_APM_NON_LOCAL_TRAFFIC=true
      - DD_APM_RECEIVER_SOCKET=/var/run/datadog/apm.socket
      - DD_DOGSTATSD_SOCKET=/var/run/datadog/dsd.socket
      - DD_HOSTNAME=swagbot-host
      - DD_LOGS_CONFIG_AUTO_MULTI_LINE_DETECTION=true
      - DD_DOGSTATSD_NON_LOCAL_TRAFFIC=true
    ports:
      - 127.0.0.1:8126:8126/tcp
    read_only: true
    tmpfs:
      - /etc/datadog-agent:mode=0755,size=16M
    security_opt:
      - no-new-privileges:true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /proc/:/host/proc/:ro
      - /sys/fs/cgroup/:/host/sys/fs/cgroup:ro
    labels:
      com.datadoghq.ad.logs: '[{"source": "agent", "service": "agent"}]'